<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Чума</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Чума</h1>
      <p class="subtitle">Minecraft 1.21.1 · NeoForge · 99 модов</p>
    </header>

    <section class="controls">
      <label for="nickname">Ник</label>
      <input id="nickname" type="text" maxlength="16" autocomplete="off"
             placeholder="как вас будут звать в игре">
      <button id="play" type="button">Играть</button>
    </section>

    <p id="notice" class="notice" hidden></p>

    <section class="progress">
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="stage">Готов к запуску</p>
    </section>

    <pre id="log" aria-live="polite"></pre>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
