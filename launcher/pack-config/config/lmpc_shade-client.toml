# Частичный конфиг lmpc_shade: только то, что делит зоны ответственности
# с Atmospherics. Остальные ключи (грейд, ночной lightmap, споры, HP)
# мод дозаполнит своими дефолтами сам.
#
# Atmospherics умеет небо и туман заметно лучше нас: держит солнце и луну
# сквозь дымку, красит облака, звёзды и горизонт, и всё это по биомам и
# по времени суток. Наш пасмурный купол (SkyType.NONE) просто выключал
# всю эту машинерию, а наш цвет тумана дрался с его цветом тумана.
# Поэтому небо и цвет тумана отданы Atmospherics, серость задаётся его
# пресетом config/ambientfog/biome_fog.json.
#
# За lmpc_shade остаётся то, чего в Atmospherics нет: цветокоррекция
# кадра, чёрная ночь через lightmap, реакция на низкое HP и споры.

[fog]
	# Цвет тумана красит Atmospherics по биомам. 0 — не вмешиваться.
	# Вернуть 0.7, если Atmospherics когда-нибудь уберут из пака.
	fogColorStrength = 0.0
	# Дальность тумана под землёй — наша, она по глубине, а не по биому,
	# и переживает любой пресет. Остаётся включённой.
	caveFogStrength = 0.8

[sky]
	# false — небо рисует ваниль, поверх неё работает Atmospherics.
	overcast = false
