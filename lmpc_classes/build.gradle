plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.mod_group
base { archivesName = project.mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

/**
 * Ponder — движок «размышлений» Create — лежит джаром-в-джаре внутри
 * джарника Create и своего джарника на рынке не имеет. Достаём его
 * в build/ и компилируемся против него; в игре его подкладывает сам
 * Create, а копия джарника в репозитории противоречила бы правилу
 * «джарники модов не версионируются».
 *
 * Заодно оттуда же берётся catnip (Pointing и прочая мелочь) — он
 * упакован внутрь того же джарника.
 */
def джарCreate = file("${projectDir}/../mods/create-1.21.1-6.0.10.jar")
def папкаPonder = layout.buildDirectory.dir('ponder').get().asFile
if (джарCreate.exists() && !папкаPonder.exists()) {
    copy {
        from zipTree(джарCreate)
        include 'META-INF/jarjar/ponder-*.jar'
        into папкаPonder
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
}

dependencies {
    // Сцены размышления — единственное место, где мы компилируемся против
    // Create. Зависимость необязательная: без Ponder класс сцен просто
    // не загружается (проверка ModList в PonderHook).
    compileOnly fileTree(dir: папкаPonder, include: '*.jar')

    // Curios не публикует джарник для рынка — компилируемся против джарника
    // из мод-пака, как plaguecore делает с Jade. Зависимость необязательная
    // (neoforge.mods.toml), пак его ставит всегда, но краха без него быть
    // не должно.
    compileOnly files("${projectDir}/../mods/curios-neoforge-9.5.1+1.21.1.jar")

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
        mod_id           : project.mod_id,
        mod_version      : project.mod_version,
        neoforge_version : project.neoforge_version,
        minecraft_version: project.minecraft_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
