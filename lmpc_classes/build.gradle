plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.mod_group
base { archivesName = project.mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

/**
 * Библиотеки Create лежат джарами-в-джаре внутри его джарника и своих
 * джарников на рынке не имеют. Достаём их в build/ и компилируемся
 * против них; в игре их подкладывает сам Create, а копии джарников
 * в репозитории противоречили бы правилу «джарники модов
 * не версионируются».
 *
 * Заодно оттуда же берётся catnip (Pointing и прочая мелочь) — он
 * упакован внутрь того же джарника.
 */
def джарCreate = file("${projectDir}/../mods/create-1.21.1-6.0.10.jar")
def папкаБиблиотек = layout.buildDirectory.dir('create-libs').get().asFile
if (джарCreate.exists() && !папкаБиблиотек.exists()) {
    copy {
        from zipTree(джарCreate)
        include 'META-INF/jarjar/*.jar'
        into папкаБиблиотек
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
}

dependencies {
    // Create — зависимость ЖЁСТКАЯ, а не мягкая, как было раньше.
    // Очиститель наследуется от KineticBlockEntity: он настоящая машина
    // Create, с валом, вращением и стрессом. Курс проекта записан
    // в docs/superpowers/notes/2026-09-06-create-style-kurs.md.
    // Без Create мод не грузится, neoforge.mods.toml помечает его
    // required, как curios.
    //
    // Вместе с Create на компиляцию идут его джары-в-джаре: ponder
    // (сцены размышления), flywheel и Registrate — на их типы
    // ссылается кинетика Create.
    compileOnly files(джарCreate)
    compileOnly fileTree(dir: папкаБиблиотек, include: '*.jar')

    // Curios не публикует джарник для рынка — компилируемся против джарника
    // из мод-пака, как plaguecore делает с Jade. Зависимость необязательная
    // (neoforge.mods.toml), пак его ставит всегда, но краха без него быть
    // не должно.
    compileOnly files("${projectDir}/../mods/curios-neoforge-9.5.1+1.21.1.jar")

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
        mod_id           : project.mod_id,
        mod_version      : project.mod_version,
        neoforge_version : project.neoforge_version,
        minecraft_version: project.minecraft_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
