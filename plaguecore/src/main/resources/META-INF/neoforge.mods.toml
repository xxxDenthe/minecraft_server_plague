modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Plague Core"
description = '''Ядро чумы: прогрессирующее заражение мира.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# GeckoLib рисует и анимирует Сердце чумы. Без него мод грузиться
# не должен: сердце — цель всей сессии, а не украшение.
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.9,5.0)"
ordering = "AFTER"
side = "BOTH"

# Зависимости от voicechat здесь нет намеренно. Плагин голоса находится
# по аннотации @ForgeVoicechatPlugin и без мода просто не грузится,
# а сам voicechat зовёт свою версию "1.21.1-2.6.22" — такую строку
# проверка диапазонов читает как версию 1.21.1 и валит запуск игры.

# Тайнопись бессонных: подмена букв рунами в экране книги.
# Врезка только клиентская, список — в plaguecore.mixins.json.
[[mixins]]
config = "plaguecore.mixins.json"
