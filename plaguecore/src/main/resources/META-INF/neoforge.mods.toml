side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Голос больного. Необязательно: без голосового чата мод грузится как обычно.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
versionRange = "[2.6,)"
ordering = "NONE"
side = "BOTH"
