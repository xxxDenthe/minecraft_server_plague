plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.mod_group
base { archivesName = project.mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // API Simple Voice Chat: мод уже в паке, нам нужны только его интерфейсы
    maven {
        name = 'henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    // GeckoLib: анимация Сердца чумы. Джарник уже в паке (mods/MODLIST.md).
    maven {
        name = 'geckolib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    // compileOnly: сам голосовой чат лежит в паке, копию внутрь джарника не тащим
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    // implementation, а не compileOnly как у voicechat: без GeckoLib
    // в дев-запуске Сердце нечем рисовать. В джарник мода не попадает —
    // NeoForge берёт его из папки mods.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Без этого консоль дев-сервера не читает stdin: команды вроде stop
// или plague info просто некуда набирать. RunGameTask наследует JavaExec,
// так что достаточно пробросить стандартный ввод.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

// Послушать голос больного на своей записи, не поднимая сервер:
//   ./gradlew voicePreview -Pwav="C:/путь/речь.wav"
// Рядом с исходником лягут файлы -стадия3.wav и -стадия4.wav.
tasks.register('voicePreview', JavaExec) {
    group = 'plaguecore'
    description = 'Прогнать WAV с речью через голос больного'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.denthe.plaguecore.core.SickVoiceCli'
    args = project.hasProperty('wav')
        ? (project.hasProperty('stage') ? [project.wav, project.stage] : [project.wav])
        : []
}

processResources {
    def props = [
        mod_id           : project.mod_id,
        mod_version      : project.mod_version,
        neoforge_version : project.neoforge_version,
        minecraft_version: project.minecraft_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
